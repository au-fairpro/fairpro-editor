# Releases the editor to S3 + CloudFront (editor.fairpro.com.au), which
# both FairPro sites embed. The bucket, distribution and deploy role are in
# fairpro-infra (terraform/live/production/editor, modules/static-site);
# runbooks/aws-app.md there, "Editor on AWS", says when to run this.
#
# Run by hand from main or a tag. The role trusts only this repository's
# aws-editor environment (GitHub's immutable OIDC subject), so the
# environment's deployment branches should also be limited to main and tags.
name: AWS deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cut short: a cancelled run could leave
# the invalidation or the clean-up half done.
concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >-
      github.repository == 'au-fairpro/fairpro-editor' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-editor
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # As Vercel builds it (vercel.json), after the same checks as CI.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fairpro-editor-${{ github.run_id }}
          aws-region: ap-southeast-2
      - name: Upload, invalidate, then remove old files
        run: node scripts/aws-deploy.ts deploy dist
        env:
          EDITOR_BUCKET: ${{ vars.EDITOR_BUCKET }}
          EDITOR_DISTRIBUTION_ID: ${{ vars.EDITOR_DISTRIBUTION_ID }}
      # Optional: the address to check, such as the CloudFront domain before
      # the DNS cutover and https://editor.fairpro.com.au/ after it.
      - name: Check the security headers match vercel.json
        if: ${{ vars.EDITOR_CHECK_URL != '' }}
        run: node scripts/aws-deploy.ts check-headers "$EDITOR_CHECK_URL"
        env:
          EDITOR_CHECK_URL: ${{ vars.EDITOR_CHECK_URL }}
